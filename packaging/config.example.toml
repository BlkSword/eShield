# eShield 配置文件示例
# 安装后通常位于 /etc/eshield/config.toml

# 要挂载 XDP 程序的网卡名
interface = "eth0"

# 日志级别: trace, debug, info, warn, error
log_level = "info"

# 是否以 JSON 格式输出日志（默认文本）
log_json = false

# 是否启用 eBPF 内核调试日志（通过 AYA_LOGS PerfEventArray 输出，默认关闭）
ebpf_log_enabled = false

# 是否启用 UDP Flood 检测
udp_flood_enabled = false

# 是否启用 ICMP/ICMPv6 Flood 检测
icmp_flood_enabled = false

# Web 控制台监听地址，默认 0.0.0.0:8720
web_bind = "0.0.0.0:8720"

# API 访问 Token（未设置则允许匿名访问）
# api_token = "changeme"

# 动态规则持久化路径（redb）
store_path = "/var/lib/eshield/rules.redb"

# 时序指标在 redb 中的保留天数（默认 30 天）
timeseries_retention_days = 30

# 告警 Webhook 配置（可选）
# alert_webhook_url = "https://hooks.example.com/eshield"
# 告警通道类型：generic / slack / dingtalk / wecom
alert_webhook_type = "generic"
alert_threshold_dps = 1000
alert_cooldown_s = 60

# 白名单 CIDR 列表（永不被拦截）
whitelist = [
    "127.0.0.1/32",
    "10.0.0.0/8",
]

# 黑名单 IP 列表（启动时加载，永久封禁）
blacklist = [
    # "192.0.2.1",
]

# 审计日志持久化（默认关闭；开启后操作审计会写入 JSON Lines 文件）
[audit]
enabled = false
path = "/var/log/eshield/audit.log"
max_size_mb = 100

[rate_limit]
enabled = true
threshold = 200             # 每个 tick 内允许的最大包数
tick_ms = 100               # 计数窗口
decay_num = 7
decay_den = 8               # 指数衰减因子 7/8
block_duration_s = 300      # 触发后封禁时长

# 按目的端口限速：对 (协议 + 目的端口) 维度限速，防换源 IP 绕过 per-IP 限速
# （源 IP 随机化时 per-IP 计数失效，端口维度恒定累计）。
# 超限仅 DROP 不加黑名单；默认关闭。阈值建议高于 per-IP（聚合多源流量）。
[port_rate_limit]
enabled = false
threshold = 2000            # 每个 tick 内单个目的端口允许的最大包数
tick_ms = 100
decay_num = 7
decay_den = 8

[syn_proxy]
enabled = false             # SYN Flood 源进入 Cookie 挑战（降级式：正常连接直通，合法客户端验证后解除）

[l7_scan]
enabled = false
patterns = [
    { pattern = "ATTACKER" },
]

[adaptive]
enabled = true
threshold = 10              # 指定窗口内触发多少次后自动封禁
window_s = 5
block_duration_s = 300

[geoip]
enabled = false
# db_path = "/usr/share/GeoIP/GeoLite2-Country.mmdb"   # MaxMind MMDB（预留）
country_blocks_csv = "/etc/eshield/geoip_country.csv"   # 自定义国家 CSV
# asn_blocks_csv = "/etc/eshield/geoip_asn.csv"         # 自定义 ASN CSV
block_countries = ["XX"]                                # 阻止的国家代码
# allow_countries = ["CN"]                              # 仅允许指定国家（与 block 互斥时使用）
# block_asns = [12345]
# allow_asns = []
default_action = "pass"

[threat_intel]
enabled = false
# feeds 支持纯文本、CSV、JSON；每行/每个元素一个 IP
# [[threat_intel.feeds]]
# name = "abuseipdb"
# url = "https://api.abuseipdb.com/api/v2/blacklist"
# interval_s = 3600
# action = "drop"
# confidence = 80

# [[threat_intel.feeds]]
# name = "cins"
# url = "https://cinsscore.com/list/ci-badguys.txt"
# interval_s = 3600
# action = "drop"

# Trust Score IP 双向信誉引擎（v0.4.0，默认关闭）
[trust_score]
enabled = false
# add_divisor = 100       # PASS: trust += (1000 - trust) / divisor
# sub_divisor = 3         # DROP: trust -= trust / divisor

# Danger Signal 系统危险信号监测（v0.4.0，默认关闭）
[danger_signal]
enabled = false
# sample_interval_s = 5
# anomaly_multiplier = 2.0

# 端口/协议 ACL 规则表（可选）
# protocol: tcp / udp / icmp / icmpv6 / any
# dport:    端口号、范围（如 1000-2000）或 any
# action:   allow / drop
# [[port_acl]]
# protocol = "tcp"
# dport = "22"
# action = "allow"

# [[port_acl]]
# protocol = "tcp"
# dport = "23"
# action = "drop"

# 防护项目（v0.4.6 起 PASS/DROP 在数据面生效）
# protocol:   tcp / udp / icmp / icmpv6 / any
# dport:      端口号或 any
# target_ips: 精确 IP 或 CIDR（IPv4 下限 /24，由控制面展开为精确 IP；IPv6 目标暂不匹配）
# action:     pass（放行）/ drop（丢弃）/ defend（复用全局防御模块）
# enabled_modules: 可绑定模块列表（syn_flood/udp_flood/icmp_flood/rate_limit/adaptive/l7_scan/geoip/tcp_reset/port_acl）
# [[protection_projects]]
# name = "web-tier"
# description = "Web 层防护"
# protocol = "tcp"
# dport = "443"
# target_ips = ["10.10.0.0/24"]
# enabled_modules = ["syn_flood", "udp_flood", "rate_limit"]
# action = "defend"

# 采样包日志（v0.4.2，默认关闭）
# [packet_log]
# enabled = false              # 是否启用数据面采样
# sample_rate = 10000          # 采样率 1/N，默认 1/10000
# memory_max_entries = 50000   # 内存中保留的最大条数
# payload_hex = true           # 是否附带 payload 十六进制预览

# Hub 分布式多节点同步（v0.4.2，默认关闭）
# [hub]
# enabled = false
# urls = ["https://hub.example.com:9930"]      # 支持配置多个 URL 做故障转移
# node_name = "web-tier-01"                    # 本节点唯一标识
# token = "change-me-to-a-long-random-string"  # 与 Hub 共享的 Bearer token
# sync_pull_interval_s = 10                    # 从 Hub 拉取策略间隔
# sync_push_interval_s = 5                     # 向 Hub 上报本地策略间隔
# push_min_hit_count = 10                      # 最少命中次数才上报
# push_min_trust = 100                         # Trust Score 低于此值才上报（0-100）
# push_max_batch_size = 100                    # 单次上报最大条数
# sync_rules_enabled = false                   # 是否同步 Hub 统一下发的规则包
# sync_rules_interval_s = 30                   # 规则包同步间隔
#
# [hub.tls]
# enabled = true
# ca_cert = "/etc/eshield/hub-ca.pem"          # 自定义 CA（可选）
# client_cert = "/etc/eshield/hub-client.pem"  # 客户端证书（可选）
# client_key = "/etc/eshield/hub-client.key"   # 客户端私钥（可选）
# verify = true                                # 是否校验服务端证书
