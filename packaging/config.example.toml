# eShield 配置文件示例（v0.5.0）
# 安装后通常位于 /etc/eshield/config.toml
#
# 注意：TOML 中表头（[xxx]）之后的所有键值都属于该表，直到下一个表头。
# 因此顶层配置项（interface / log_level / whitelist / api_token ...）必须写在所有
# [section] 之前；本文件已按此顺序组织，直接追加新配置段时请放在文件末尾。

# ── 顶层配置 ─────────────────────────────────────────────────────────

# 要挂载 XDP 程序的网卡名
interface = "eth0"

# 日志级别: trace, debug, info, warn, error
log_level = "info"

# 是否以 JSON 格式输出日志（默认文本）
log_json = false

# 是否启用 eBPF 内核调试日志（通过 AYA_LOGS PerfEventArray 输出，默认关闭）
ebpf_log_enabled = false

# 是否启用 UDP Flood 检测
udp_flood_enabled = false

# 是否启用 ICMP/ICMPv6 Flood 检测
icmp_flood_enabled = false

# 丢弃 TCP 包时是否回复 RST（默认关闭）
tcp_reset_on_drop = false

# Web 控制台监听地址，默认 0.0.0.0:8720。
# 安全提示：控制台/API 默认是明文 HTTP + Bearer Token；对外提供服务时必须放在
# nginx/Caddy 等 TLS 反向代理之后，否则 token 会被明文嗅探（进程启动会告警）。
# 若已由反代终结 TLS，设置环境变量 ESHIELD_ASSUME_TLS_PROXY=1 可关闭告警。
web_bind = "0.0.0.0:8720"

# API 访问 Token。
# 未设置时进程启动会生成随机 Token（日志只打印前缀），外部请求仍必须携带 Bearer Token；
# 本机 127.0.0.1/::1 的 CLI/TUI 请求免校验。可用 `eshield reset-token` 生成新 Token。
# api_token = "changeme"

# 只读 Token（v0.5.0，可选）。使用该 Token 的请求只允许 GET/HEAD/OPTIONS，
# 写操作（POST/PATCH/DELETE 等）返回 403；适合 Prometheus 抓取、只读大屏、监控系统。
# 角色可通过 GET /api/auth/check 查询（{"role":"readonly"}）。留空表示不启用只读角色。
# 注意：修改后需重启服务生效；不要与 api_token 相同（相同时按 admin 处理）。
# readonly_token = "readonly-changeme"

# 动态规则持久化路径（redb）
store_path = "/var/lib/eshield/rules.redb"

# eBPF map 条目数采样周期（秒，默认 30；/metrics 与 /api/map-usage 只读该缓存，不做实时遍历）
metrics_interval_s = 30

# 时序指标在 redb 中的保留天数（默认 30 天）
timeseries_retention_days = 30

# 告警 Webhook 配置（可选）
# alert_webhook_url = "https://hooks.example.com/eshield"
# 告警通道类型：generic / slack / dingtalk / wecom
alert_webhook_type = "generic"
alert_threshold_dps = 1000
alert_cooldown_s = 60

# 白名单 CIDR 列表（永不被拦截）
whitelist = [
    "127.0.0.1/32",
    "10.0.0.0/8",
]

# 黑名单 IP 列表（启动时加载，永久封禁）
blacklist = [
    # "192.0.2.1",
]

# ── XDP 挂载策略 ─────────────────────────────────────────────────────

# XDP 挂载策略（v0.4.8）
#   auto    —— 先 native(DRV)，失败回退 generic(SKB)，默认
#   native  —— 只允许 native，失败直接报错退出（避免误以为跑在 native 上）
#   generic —— 强制 SKB（veth/虚拟网卡或驱动不支持 native）
# 注意：virtio_net 在宿主机开启 GRO_HW/CSUM 时会拒绝 native XDP；
# `ethtool -k eth0 | grep rx-gro-hw` 显示 [fixed] 时 guest 无法关闭，只能 generic。
[xdp]
mode = "auto"
disable_offloads = true     # native 失败时尝试关闭 rx-gro-hw/tx-checksum 后重试一次
auto_reattach = true        # 每 15s 校验挂载状态，被摘掉时自动重挂并使 /ready 降级
# 非首片 IPv4 分片策略（v0.5.0）：
#   rate_limit —— 按「协议 + 0 端口」在 PORT_RATE_MAP 聚合限速，超阈值丢弃（默认，推荐）
#   drop       —— 直接丢弃所有非首片分片（最严格；可能影响依赖 IP 分片的合法大包/隧道）
#   pass       —— 跳过 L4 模块直接放行（v0.4.x 兼容行为，存在伪造源分片绕过风险，不推荐）
# 背景：非首片分片没有 L4 头，v0.4.x 会跳过全部端口/L4 模块，实测伪造源分片 SYN/UDP 可整段放行。
# 注意：rate_limit 依赖 [port_rate_limit].enabled = true；若关闭端口聚合限速，分片等同 pass。
fragment_policy = "rate_limit"

# ── 启动资源预检 ─────────────────────────────────────────────────────

# 启动资源预检（v0.5.0）：避免在过小规格机器上"装上就跑、跑着被 OOM"。
# 背景：实测 400MB 内存实例装 nginx + eShield 后 sshd 失去响应（TCP 通但 banner 不返回）。
# 内存构成：eBPF map 约 75–82MB（按容量预分配）+ 进程 RSS 约 48MB + 业务进程。
[limits]
min_memory_mb = 512         # 低于该值：启动时打印告警（建议 >= 1GB）
refuse_memory_mb = 256      # 低于该值：直接拒绝启动；可临时用 ESHIELD_ALLOW_LOW_MEMORY=1 强制启动（不推荐）

# ── 审计 ─────────────────────────────────────────────────────────────

# 审计日志持久化（默认关闭；开启后操作审计会写入 JSON Lines 文件）
# v0.5.0 起文件后端每条记录带 seq/prev_hash/hash 哈希链，可用 GET /api/audit/verify 校验；
# 进程重启后自动从文件尾部恢复链。超过 max_size_mb 轮转为 audit.log.1~.3。
[audit]
enabled = false
path = "/var/log/eshield/audit.log"
max_size_mb = 100

# ── 速率限制 ─────────────────────────────────────────────────────────

[rate_limit]
enabled = true
# threshold 是「突发信用」：指数衰减后的计数器稳态 ≈ (每 tick 到达数) / (1 - decay_num/decay_den)。
# 默认 100ms tick + 7/8 衰减时，稳态约为每 tick 到达数的 8 倍，
# 即 threshold=200 对应的持续速率约为 25 包/100ms ≈ 250pps（单 IP）。
# 早期版本默认 200（≈250pps 即触发），对 NAT 出口/健康检查/API 客户端过于激进，
# v0.4.8 起默认 2000（≈2500pps 持续速率）；要更严格可调小，要更宽松可调大。
threshold = 2000            # 每个 tick 内允许的最大包数（突发信用）
tick_ms = 100               # 计数窗口
decay_num = 7
decay_den = 8               # 指数衰减因子 7/8
block_duration_s = 120      # 触发后封禁时长（adaptive 会对重复攻击源自动加长）
# 计数维度：false=按源 IP 合计（默认）；true=按 源IP+目的端口 分组。
# NAT / 单 IP 承载多业务端口时建议开启，避免不同业务共享一个计数器互相挤占额度。
dport_grouping = false
# 超限后的处置模式（v0.5.0）：
#   hard —— 写入黑名单，后续包走黑名单快路径丢弃（默认，对攻击源最有效）
#   soft —— 只丢弃超限包、不写黑名单，流量回落后自动恢复；
#           适合 NAT 出口 / 共享代理 IP / 多用户共享出口，避免整段出口被误封
# 作用于全局限速、UDP Flood、ICMP Flood 三条超限路径。
block_mode = "hard"

# 按目的端口限速：对 (协议 + 目的端口) 维度限速，防换源 IP 绕过 per-IP 限速
# （源 IP 随机化时 per-IP 计数失效，端口维度恒定累计）。
# v0.5.0 起默认开启：实测伪造随机源 20k pps 时 per-IP 黑名单/限速完全不触发，
# 端口维度是唯一不依赖源地址的兜底；同时覆盖 TCP/UDP/ICMP 与非首片分片。
# 超限仅 DROP 不加黑名单。threshold 为每个 tick 的固定窗口额度（不做指数衰减），
# 默认 2000/100ms ≈ 单端口 20000 pps，聚合多源流量时应高于 per-IP 阈值。
[port_rate_limit]
enabled = true
threshold = 2000            # 每个 tick 内单个目的端口允许的最大包数
tick_ms = 100                # 固定窗口；该模块不使用 decay_num/decay_den

# ── 各防护模块 ───────────────────────────────────────────────────────

# SYN Cookie 代理（实验特性，默认关闭；IPv4 TCP）
[syn_proxy]
enabled = false             # SYN Flood 源进入 Cookie 挑战（降级式：正常连接直通，合法客户端验证后解除）
# 挑战包仅支持 20 字节 IPv4 头 + 20/24 字节 TCP 头（单 MSS option）。
# 带 timestamps/SACK 等选项的 SYN（常见 40 字节头）无法构造 Cookie 挑战，此类源一旦
# 触发阈值会被直接丢弃（最长 30s，期间该源的新连接都会失败），否则这类 SYN Flood 会
# 绕过防护直通内核。面向真实客户端的高流量服务建议保持关闭，改用 SYN Flood 检测。

# L7 首包指纹（不是 WAF：仅 TCP 首包 8 字节，无重组）
[l7_scan]
enabled = false
patterns = [
    { pattern = "ATTACKER" },
]

# 自适应阈值：重复触发自动提升封禁时长
[adaptive]
enabled = true
threshold = 10              # 指定窗口内触发多少次后自动封禁
window_s = 5
block_duration_s = 300

# GeoIP / ASN 过滤
[geoip]
enabled = false
# db_path = "/usr/share/GeoIP/GeoLite2-Country.mmdb"   # 预留：当前仅支持 CSV，MMDB 尚未接入
country_blocks_csv = "/etc/eshield/geoip_country.csv"   # 自定义国家 CSV
# asn_blocks_csv = "/etc/eshield/geoip_asn.csv"         # 自定义 ASN CSV
block_countries = ["XX"]                                # 阻止的国家代码
# allow_countries = ["CN"]                              # 仅允许指定国家（default_action="drop" 时生效）
# block_asns = [12345]
# allow_asns = []
# default_action = "pass"  # pass=仅按 block 列表拦截；drop=仅放行 allow 列表

# 自定义威胁情报 feed
[threat_intel]
enabled = false
# feeds 支持纯文本、CSV、JSON；每行/每个元素一个 IP
# [[threat_intel.feeds]]
# name = "abuseipdb"
# url = "https://api.abuseipdb.com/api/v2/blacklist"
# interval_s = 3600
# action = "drop"
# confidence = 80

# [[threat_intel.feeds]]
# name = "cins"
# url = "https://cinsscore.com/list/ci-badguys.txt"
# interval_s = 3600
# action = "drop"

# 连接跟踪 / 半连接 CC 防御（v0.4.7，默认关闭；启用后仅 SYN/ACK/RST 触碰 map）
[conn_track]
enabled = false
threshold = 20              # 单源窗口内未完成握手 SYN 数阈值
window_ms = 10000           # 统计窗口（毫秒）

# Trust Score IP 双向信誉引擎（v0.4.0，默认关闭）
[trust_score]
enabled = false
# add_divisor = 100       # PASS: trust += (1000 - trust) / divisor（已接入数据面）
# sub_divisor = 3         # DROP: trust -= trust / divisor（已接入数据面）

# Danger Signal 系统危险信号监测（v0.4.0，默认关闭）
[danger_signal]
enabled = false
# sample_interval_s = 5
# anomaly_multiplier = 2.0

# ── 规则与策略 ───────────────────────────────────────────────────────

# 端口/协议 ACL 规则表（可选）
# protocol: tcp / udp / icmp / icmpv6 / any
# dport:    端口号、范围（如 1000-2000）或 any
# action:   allow / drop
# [[port_acl]]
# protocol = "tcp"
# dport = "22"
# action = "allow"

# [[port_acl]]
# protocol = "tcp"
# dport = "23"
# action = "drop"

# 防护项目（v0.4.6 起 PASS/DROP 在数据面生效）
# protocol:   tcp / udp / icmp / icmpv6 / any
# dport:      端口号或 any
# target_ips: 精确 IP 或 CIDR（IPv4 下限 /24，由控制面展开为精确 IP；IPv6 目标暂不匹配）
# action:     pass（放行）/ drop（丢弃）/ defend（复用全局防御模块）
# enabled_modules: 可绑定模块列表（syn_flood/udp_flood/icmp_flood/rate_limit/adaptive/l7_scan/geoip/tcp_reset/port_acl）
# [[protection_projects]]
# name = "web-tier"
# description = "Web 层防护"
# protocol = "tcp"
# dport = "443"
# target_ips = ["10.10.0.0/24"]
# enabled_modules = ["syn_flood", "udp_flood", "rate_limit"]
# action = "defend"

# 采样包日志（v0.4.2，默认关闭）
# [packet_log]
# enabled = false              # 是否启用数据面采样
# sample_rate = 10000          # 采样率 1/N，默认 1/10000
# memory_max_entries = 50000   # 内存中保留的最大条数
# payload_hex = true           # 是否附带 payload 十六进制预览

# Hub 分布式多节点同步（v0.4.2，默认关闭）
# [hub]
# enabled = false
# urls = ["https://hub.example.com:9930"]      # 支持配置多个 URL 做故障转移
# node_name = "web-tier-01"                    # 本节点唯一标识
# token = "change-me-to-a-long-random-string"  # 与 Hub 共享的 Bearer token
# sync_pull_interval_s = 10                    # 从 Hub 拉取策略间隔
# sync_push_interval_s = 5                     # 向 Hub 上报本地策略间隔
# push_min_hit_count = 10                      # 最少命中次数才上报
# push_min_trust = 100                         # Trust Score 低于此值才上报（0-100）
# push_max_batch_size = 100                    # 单次上报最大条数
# sync_rules_enabled = false                   # 是否同步 Hub 统一下发的规则包
# sync_rules_interval_s = 30                   # 规则包同步间隔
#
# [hub.tls]
# enabled = true
# ca_cert = "/etc/eshield/hub-ca.pem"          # 自定义 CA（可选）
# client_cert = "/etc/eshield/hub-client.pem"  # 客户端证书（可选）
# client_key = "/etc/eshield/hub-client.key"   # 客户端私钥（可选）
# verify = true                                # 是否校验服务端证书
