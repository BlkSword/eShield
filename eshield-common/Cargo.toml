[package]
name = "eshield-common"
version = "0.4.5"
edition = "2021"
license = "Apache-2.0"
description = "Shared types and constants between eBPF and userspace"

[features]
default = []
userspace = ["aya", "serde"]

[dependencies]
aya = { workspace = true, optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
