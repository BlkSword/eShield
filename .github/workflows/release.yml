name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (for eBPF build-std)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-31
          components: rust-src

      - name: Install Rust stable + musl target
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install build dependencies
        # musl-tools: ring 等 C 依赖在 musl target 下需要 x86_64-linux-musl-gcc
        run: sudo apt-get update && sudo apt-get install -y llvm clang musl-tools zstd

      - name: Install bpf-linker (pinned 0.10.4 prebuilt)
        run: |
          curl -fL -o /tmp/bpf-linker.tar.zst https://github.com/aya-rs/bpf-linker/releases/download/v0.10.4/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo install -m 0755 /tmp/bpf-linker /usr/local/bin/bpf-linker
          bpf-linker --version

      - name: Build eBPF
        run: cargo +nightly-2026-07-31 build --package eshield-ebpf --target bpfel-unknown-none -Z build-std=core --release

      - name: Build userspace
        run: |
          cargo build --package eshield --target x86_64-unknown-linux-musl --release
          cargo build --package eshield-hub --release

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/eshield dist/eshield-x86_64-unknown-linux-musl
          cp target/bpfel-unknown-none/release/eshield dist/eshield.bpf.o
          cp target/release/eshield-hub dist/eshield-hub-x86_64-unknown-linux-gnu
          chmod +x dist/eshield-x86_64-unknown-linux-musl dist/eshield-hub-x86_64-unknown-linux-gnu
          (cd dist && sha256sum eshield-x86_64-unknown-linux-musl eshield-hub-x86_64-unknown-linux-gnu eshield.bpf.o > SHA256SUMS)
          ls -lh dist/

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## ${VERSION}/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="eShield ${GITHUB_REF_NAME} release."
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: eShield ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          draft: false
          prerelease: false
