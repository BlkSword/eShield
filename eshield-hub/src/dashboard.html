<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eShield Hub 控制台</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#0d1117; --surface:#161b22; --surface-2:#11161d; --hover:#1b222c;
    --border:#252c36; --border-strong:#303945;
    --text:#e6edf3; --muted:#a7b1bd; --mute:#6e7a88;
    --accent:#4f8cff; --accent-strong:#6aa0ff;
    --success:#22c55e; --success-soft:rgba(34,197,94,.12);
    --danger:#ef4444; --danger-soft:rgba(239,68,68,.13);
    --warning:#f59e0b; --warning-soft:rgba(245,158,11,.14);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    --radius:5px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f4f6f9; --surface:#fff; --surface-2:#f8fafc; --hover:#f1f5f9;
      --border:#e4e8ef; --border-strong:#d5dbe4;
      --text:#1f2937; --muted:#4b5563; --mute:#8b95a3;
      --accent:#2f6fed; --accent-strong:#1d5fd8;
      --success:#16a34a; --success-soft:rgba(22,163,74,.10);
      --danger:#dc2626; --danger-soft:rgba(220,38,38,.10);
      --warning:#d97706; --warning-soft:rgba(217,119,6,.12);
    }
  }
  * { box-sizing:border-box; border-radius:var(--radius); }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; }
  .topbar { height:48px; display:flex; align-items:center; gap:12px; padding:0 16px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  .brand { font-size:14px; font-weight:650; }
  .brand-sub { font-size:11px; color:var(--mute); border-left:1px solid var(--border); padding-left:9px; margin-left:2px; }
  .spacer { flex:1; }
  .input, button { height:28px; padding:0 9px; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text); font:12px var(--sans); outline:none; }
  .input:focus { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:var(--accent-strong); border-color:var(--accent-strong); }
  button.danger { color:var(--danger); border-color:color-mix(in srgb,var(--danger) 40%,transparent); background:transparent; }
  button.danger:hover { background:var(--danger-soft); }
  .container { max-width:1280px; margin:0 auto; padding:16px; }
  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:14px; }
  .kpi { background:var(--surface); border:1px solid var(--border); padding:12px 14px; min-height:78px; display:flex; flex-direction:column; justify-content:center; }
  .kpi-label { font-size:11px; color:var(--mute); }
  .kpi-value { font:650 24px/1.1 var(--mono); margin-top:5px; }
  .kpi-foot { font-size:11px; color:var(--mute); margin-top:5px; }
  .section { margin-bottom:16px; }
  .section-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .section-title { font-size:13px; font-weight:650; }
  .section-sub { font-size:11px; color:var(--mute); }
  .toolbar { display:flex; gap:8px; align-items:center; margin-left:auto; }
  .table-wrap { overflow:auto; border:1px solid var(--border); background:var(--surface); }
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:12px; }
  th { text-align:left; font-weight:600; color:var(--mute); background:var(--surface-2); border-bottom:1px solid var(--border); padding:7px 10px; white-space:nowrap; }
  td { height:32px; padding:4px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:hover td { background:var(--hover); }
  .mono { font-family:var(--mono); font-size:11.5px; }
  .tag { display:inline-flex; align-items:center; height:18px; padding:0 6px; border:1px solid var(--border); background:var(--surface-2); color:var(--muted); font-size:10.5px; font-weight:600; }
  .tag.online { color:var(--success); background:var(--success-soft); border-color:color-mix(in srgb,var(--success) 28%,transparent); }
  .tag.offline { color:var(--danger); background:var(--danger-soft); border-color:color-mix(in srgb,var(--danger) 28%,transparent); }
  .empty { color:var(--mute); text-align:center; padding:24px; }
  #toast { position:fixed; right:16px; bottom:16px; z-index:20; background:var(--surface); border:1px solid var(--border-strong); border-left:3px solid var(--success); padding:10px 12px; box-shadow:0 12px 32px rgba(0,0,0,.35); display:none; font-size:12px; }
  @media (max-width:900px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">eShield Hub</div>
  <span class="brand-sub">分布式策略控制台</span>
  <div class="spacer"></div>
  <input class="input mono" type="password" id="token" placeholder="Hub Token" style="width:220px">
  <button class="primary" onclick="loadAll()">刷新</button>
</div>
<div class="container">
  <div class="kpis">
    <div class="kpi"><div class="kpi-label">共享策略数</div><div class="kpi-value" id="stat-policies">-</div><div class="kpi-foot">Hub 当前下发策略总量</div></div>
    <div class="kpi"><div class="kpi-label">注册节点</div><div class="kpi-value" id="stat-nodes">-</div><div class="kpi-foot">累计接入节点</div></div>
    <div class="kpi"><div class="kpi-label">在线节点</div><div class="kpi-value" id="stat-online">-</div><div class="kpi-foot">最近心跳在阈值内</div></div>
    <div class="kpi"><div class="kpi-label">同步状态</div><div class="kpi-value" style="font-size:16px" id="stat-sync">等待加载</div><div class="kpi-foot">策略拉取 / 上报</div></div>
  </div>
  <div class="section">
    <div class="section-head">
      <div class="section-title">节点列表</div>
      <div class="section-sub">节点名 · 最后心跳 · 状态</div>
      <div class="toolbar"><button onclick="loadNodes()">刷新节点</button></div>
    </div>
    <div class="table-wrap">
      <table><thead><tr><th>节点名</th><th>最后心跳</th><th>状态</th></tr></thead><tbody id="nodes-body"><tr><td colspan="3" class="empty">点击刷新加载</td></tr></tbody></table>
    </div>
  </div>
  <div class="section">
    <div class="section-head">
      <div class="section-title">共享策略</div>
      <div class="section-sub">来自各节点的动态封禁与策略</div>
      <div class="toolbar"><button onclick="loadPolicies()">刷新策略</button></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>IP</th><th>来源节点</th><th>命中次数</th><th>信誉分</th><th>原因</th><th>操作</th></tr></thead>
        <tbody id="policies-body"><tr><td colspan="6" class="empty">点击刷新加载</td></tr></tbody>
      </table>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script>
  const api = (path) => `/api/v1${path}`;
  const TOKEN_KEY = 'eshield-hub-token';
  const token = () => document.getElementById('token').value.trim();
  const headers = () => ({ 'Authorization': `Bearer ${token()}`, 'Content-Type': 'application/json' });
  function saveToken() { const t = token(); if (t) localStorage.setItem(TOKEN_KEY, t); }
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem(TOKEN_KEY);
    if (saved) document.getElementById('token').value = saved;
  });
  function show(msg, isErr) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    t.style.borderLeftColor = isErr ? 'var(--danger)' : 'var(--success)';
    setTimeout(() => t.style.display = 'none', 3000);
  }
  async function get(path) {
    const r = await fetch(api(path), { headers: { 'Authorization': `Bearer ${token()}` } });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    return r.json();
  }
  async function loadAll() {
    saveToken();
    try {
      await Promise.all([loadStats(), loadNodes(), loadPolicies()]);
      show('加载完成');
    } catch (e) { show(e.message, true); }
  }
  async function loadStats() {
    const s = await get('/stats');
    document.getElementById('stat-policies').textContent = s.policy_count;
    document.getElementById('stat-nodes').textContent = s.node_count;
    document.getElementById('stat-online').textContent = s.online_node_count;
    const sync = document.getElementById('stat-sync');
    sync.textContent = s.online_node_count > 0 ? '正常' : '无在线节点';
    sync.style.color = s.online_node_count > 0 ? 'var(--success)' : 'var(--warning)';
  }
  async function loadNodes() {
    const data = await get('/nodes');
    const body = document.getElementById('nodes-body');
    if (!data.nodes.length) { body.innerHTML = '<tr><td colspan="3" class="empty">暂无节点</td></tr>'; return; }
    const now = Date.now() * 1e6;
    body.innerHTML = data.nodes.map(n => {
      const ago = Math.max(0, Math.floor((now - n.last_seen_ns) / 1e9));
      const cls = n.online ? 'online' : 'offline';
      return `<tr><td>${escapeHtml(n.name)}</td><td class="mono">${ago}s 前</td><td><span class="tag ${cls}">${n.online ? '在线' : '离线'}</span></td></tr>`;
    }).join('');
  }
  async function loadPolicies() {
    const data = await get('/policies?since=0&limit=200');
    const body = document.getElementById('policies-body');
    if (!data.policies.length) { body.innerHTML = '<tr><td colspan="6" class="empty">暂无策略</td></tr>'; return; }
    body.innerHTML = data.policies.map(p => {
      const ip = formatIp(p.ip);
      return `<tr><td class="mono">${ip}</td><td>${p.source_nodes.map(escapeHtml).join(', ')}</td><td class="mono">${p.hit_count}</td><td class="mono">${p.trust_score}</td><td>${escapeHtml(p.reason)}</td><td><button class="danger" onclick="deletePolicy('${ip}')">解封</button></td></tr>`;
    }).join('');
  }
  async function deletePolicy(ip) {
    if (!confirm(`确认从集群解封 ${ip}？`)) return;
    try {
      const r = await fetch(api('/policies'), { method:'DELETE', headers: headers(), body: JSON.stringify({ node_name: 'hub-dashboard', ips: [parseIp(ip)] }) });
      if (!r.ok) throw new Error(await r.text());
      show('解封已下发'); loadPolicies();
    } catch (e) { show(e.message, true); }
  }
  function formatIp(ip) {
    if (ip.family === 4) {
      const a = ip.addr;
      return `${a[12]}.${a[13]}.${a[14]}.${a[15]}`;
    }
    const hex = [];
    for (let i = 0; i < 16; i += 2) hex.push(((ip.addr[i] << 8) | ip.addr[i+1]).toString(16));
    return hex.join(':');
  }
  function parseIp(s) {
    if (s.includes(':')) {
      const parts = s.split(':'); const addr = new Array(16).fill(0);
      for (let i = 0; i < 8; i++) { const v = parseInt(parts[i] || '0', 16); addr[i*2] = v >> 8; addr[i*2+1] = v & 0xff; }
      return { family: 6, addr, padding: new Array(15).fill(0) };
    }
    const parts = s.split('.'); const addr = new Array(16).fill(0);
    for (let i = 0; i < 4; i++) addr[12+i] = parseInt(parts[i], 10);
    return { family: 4, addr, padding: new Array(15).fill(0) };
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  loadAll();
</script>
</body>
</html>
