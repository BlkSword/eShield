<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eShield 控制台</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/pages.css">
<script>window.__INITIAL_CONFIG__ = __CONFIG_JSON__;</script>
<script src="/static/echarts.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">ES</div>
      <div>
        <div class="brand-name">eShield</div>
        <div class="brand-sub">主机防护控制台</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="line"><span>版本</span><span id="versionText">v—</span></div>
      <div class="line"><span>XDP</span><span id="xdpName">—</span></div>
      <div class="line"><span>接口</span><span id="xdpMeta">—</span></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb"><strong id="pageTitle">总览</strong><span class="sep">/</span><span id="pageSub"></span></div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <span class="pill" id="sseChip"><span class="dot"></span><span id="sseLabel">连接中</span></span>
        <span class="pill" id="dangerPill"><span id="dangerText">危险等级 L0 · 平稳</span></span>
        <span class="pill">PPS <span class="mono" id="hdrPps">0</span></span>
        <span class="pill">DROP <span class="mono" id="hdrDps">0</span></span>
        <span class="search-box"><input id="globalSearch" type="text" placeholder="搜索 IP / 规则" autocomplete="off" spellcheck="false"><kbd>/</kbd></span>
      </div>
    </header>
    <main class="content" id="page"></main>
  </div>
</div>
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast-wrap" id="toastWrap"></div>
<div class="palette" id="palette">
  <input id="paletteInput" type="text" placeholder="输入命令：跳转页面、聚焦搜索、重载配置" autocomplete="off">
  <div class="palette-list" id="paletteList"></div>
</div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
